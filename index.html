<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Saya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101827;
            font-family: Arial, sans-serif;
            color: white;
        }

        .calculator {
            width: 340px;
            padding: 25px;
            background: #1e293b;
            border-radius: 22px;
            box-shadow: 0 15px 40px #0005;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 75px;
            margin-bottom: 18px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            background: #334155;
            color: white;
        }

        button:hover {
            filter: brightness(1.25);
        }

        .operator {
            background: #2563eb;
        }

        .clear {
            background: #dc2626;
        }

        .equal {
            background: #16a34a;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Kalkulator</h2>

        <input id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="backspace()">⌫</button>
            <button class="operator" onclick="choose('%')">%</button>
            <button class="operator" onclick="choose('/')">÷</button>

            <button onclick="number('7')">7</button>
            <button onclick="number('8')">8</button>
            <button onclick="number('9')">9</button>
            <button class="operator" onclick="choose('*')">×</button>

            <button onclick="number('4')">4</button>
            <button onclick="number('5')">5</button>
            <button onclick="number('6')">6</button>
            <button class="operator" onclick="choose('-')">−</button>

            <button onclick="number('1')">1</button>
            <button onclick="number('2')">2</button>
            <button onclick="number('3')">3</button>
            <button class="operator" onclick="choose('+')">+</button>

            <button onclick="number('0')">0</button>
            <button onclick="decimal()">.</button>
            <button onclick="toggleSign()">±</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let current = "0";
        let previous = null;
        let operator = null;
        let resetNext = false;

        function update() {
            display.value = current;
        }

        function number(value) {
            if (resetNext || current === "0") {
                current = value;
                resetNext = false;
            } else {
                current += value;
            }
            update();
        }

        function decimal() {
            if (resetNext) {
                current = "0";
                resetNext = false;
            }

            if (!current.includes(".")) {
                current += ".";
            }
            update();
        }

        function choose(op) {
            if (op === "%") {
                current = String(Number(current) / 100);
                update();
                return;
            }

            if (operator && !resetNext) {
                calculate();
            }

            previous = Number(current);
            operator = op;
            resetNext = true;
        }

        function calculate() {
            if (operator === null || previous === null) return;

            const a = previous;
            const b = Number(current);
            let result;

            switch (operator) {
                case "+": result = a + b; break;
                case "-": result = a - b; break;
                case "*": result = a * b; break;
                case "/":
                    if (b === 0) {
                        current = "Tidak bisa dibagi 0";
                        previous = null;
                        operator = null;
                        resetNext = true;
                        update();
                        return;
                    }
                    result = a / b;
                    break;
            }

            current = String(Number(result.toPrecision(12)));
            previous = null;
            operator = null;
            resetNext = true;
            update();
        }

        function clearDisplay() {
            current = "0";
            previous = null;
            operator = null;
            resetNext = false;
            update();
        }

        function backspace() {
            if (resetNext) return;

            current = current.length > 1
                ? current.slice(0, -1)
                : "0";

            update();
        }

        function toggleSign() {
            if (current === "0") return;
            current = String(-Number(current));
            update();
        }

        document.addEventListener("keydown", function(event) {
            if (event.key >= "0" && event.key <= "9") {
                number(event.key);
            } else if (event.key === ".") {
                decimal();
            } else if (["+", "-", "*", "/"].includes(event.key)) {
                choose(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                calculate();
            } else if (event.key === "Backspace") {
                backspace();
            } else if (event.key === "Escape") {
                clearDisplay();
            }
        });
    </script>

</body>
</html>
